<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Sinfín</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<meta name="theme-color" content="#620209">
<script>try{if(localStorage.getItem('sinfin-pin'))document.documentElement.dataset.lock='1'}catch(e){}</script>
<script>try{document.documentElement.dataset.estilo=localStorage.getItem('sinfin-estilo')||'clasico'}catch(e){document.documentElement.dataset.estilo='clasico'}</script>
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
:root{--bg:#f6f3f2;--surface:#fff;--ink:#2a1d20;--muted:#75686b;--line:#e6dcdc;--accent:#620209;--accent-ink:#fff;--ok:#2f7d4f;--warn:#a86a0f;--bad:#b3382c;--info:#2f5d8a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1315;--surface:#261b1e;--ink:#f3eaeb;--muted:#b4a3a6;--line:#3a2a2e;--accent:#e08a92;--accent-ink:#2a0508;--ok:#6cc08b;--warn:#e0a24a;--bad:#ff8f80;--info:#8dbcea;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1315;--surface:#261b1e;--ink:#f3eaeb;--muted:#b4a3a6;--line:#3a2a2e;--accent:#e08a92;--accent-ink:#2a0508;--ok:#6cc08b;--warn:#e0a24a;--bad:#ff8f80;--info:#8dbcea;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Nunito Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;margin:0;line-height:1.2}
.wrap{max-width:980px;margin:0 auto;padding:16px}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
h1{font-size:26px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.link{border:0;background:none;color:var(--accent);padding:4px 6px}
button.danger{color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
.totals div{padding:12px 14px;border-right:1px solid var(--line)}.totals div:last-child{border:0}
.totals small{display:block;color:var(--muted)}.totals b{font-size:19px;font-variant-numeric:tabular-nums}
.pending b{color:var(--warn)}.paid b{color:var(--ok)}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tools input,.tools select{flex:1;min-width:140px}
input,select,textarea{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.case{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c,var(--line));border-radius:12px;padding:12px 14px;margin-bottom:8px}
.case .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.case .t{font-weight:600}.case .m{color:var(--muted);font-size:13px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.detail{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.detail .head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.kv small{display:block;color:var(--muted)}.kv b{font-size:17px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:18px 0 6px;border-bottom:1px solid var(--line);padding-bottom:6px}
.sec h3{font-size:17px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:13px}
td.r,th.r{text-align:right}
.empty{color:var(--muted);padding:18px 4px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);width:min(440px,calc(100% - 24px));padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;margin:10px 0 3px;font-weight:500}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.hide{display:none!important}
.err{color:var(--bad);font-size:13px;margin-top:6px;min-height:1em}
@media (max-width:520px){.totals b{font-size:16px}.wrap{padding:12px}}
.tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 14px;color:var(--muted)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:4px 0 12px 12px}
.tl li::before{content:"";position:absolute;left:-21px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tl .m{color:var(--muted);font-size:13px}
.calhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.calhead h2{font-size:20px;min-width:150px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:8px}
.wd{background:var(--surface);text-align:center;padding:6px 0;color:var(--muted);font-size:13px}
.day{background:var(--surface);min-height:84px;padding:4px;cursor:pointer;overflow:hidden}
.day.off{background:var(--bg);cursor:default}
.day.now .dn{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 6px}
.dn{font-size:13px;display:inline-block;margin-bottom:2px}
.ev{display:block;font-size:11.5px;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);padding:1px 4px;margin-top:2px;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{font-size:11px;color:var(--muted)}
.evrow{display:flex;width:100%;text-align:left;gap:10px;justify-content:space-between;border-left:4px solid var(--c);margin-bottom:6px}
@media (max-width:520px){.day{min-height:56px}.ev{font-size:0;height:6px;padding:0}}
.alert{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.alert>b{display:block;margin-bottom:6px}
.alert .evrow{margin-bottom:4px}
#auth{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:16px}
.authbox{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.authbox h2{font-size:22px;margin:8px 0 4px}
.row2{display:flex;gap:8px;margin-top:14px}.row2 button{flex:1}
.logo{height:46px;width:auto;display:block}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-size:25px}
.authbox .logo{height:64px}
.hello{margin:0 0 12px;color:var(--muted)}
.case,.detail,.totals,.alert{box-shadow:0 1px 3px rgba(60,20,25,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:brightness(0) invert(.93)}}
:root[data-theme="dark"] .logo{filter:brightness(0) invert(.93)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 1px 3px rgba(60,20,25,.07)}
.kpi small{display:block;color:var(--muted)}
.kpi b{font-family:"Source Serif 4",Georgia,serif;font-size:28px;font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(60,20,25,.07)}
.panel h3{font-size:17px;margin-bottom:2px}.panel>p{margin:0 0 10px;color:var(--muted);font-size:13px}
.age{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.age div{border-radius:10px;padding:10px 12px;border:1px solid var(--line)}
.age b{display:block;font-size:26px;font-family:"Source Serif 4",Georgia,serif}
.age .g{background:color-mix(in srgb,var(--ok) 13%,var(--surface));color:var(--ok)}
.age .a{background:color-mix(in srgb,var(--warn) 13%,var(--surface));color:var(--warn)}
.age .r{background:color-mix(in srgb,var(--bad) 13%,var(--surface));color:var(--bad)}
.age .n{color:var(--muted)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}
.donut{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:8px}
.legend{flex:1;min-width:140px;list-style:none;margin:0;padding:0}
.legend li{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
@media (min-width:900px){
.wrap{max-width:1180px;display:grid;grid-template-columns:200px minmax(0,1fr);column-gap:28px;align-items:start}
header.top{grid-column:1/-1}
.tabs{grid-column:1;flex-direction:column;border:0;gap:2px;position:sticky;top:12px}
.tabs button{text-align:left;border:0;border-left:3px solid transparent;padding:10px 14px;border-radius:0 10px 10px 0}
.tabs button.on{background:var(--surface);border-left-color:var(--accent)}
.wrap>section{grid-column:2}}
.rinfo{margin:6px 0 0;padding:8px 10px;border-radius:10px;background:var(--bg);font-size:13px;color:var(--muted)}
.rinfo:empty{display:none}.rinfo b{color:var(--ink)}

/* Estilos Sinfín */
@media (prefers-color-scheme:light){
:root[data-estilo="rosa"]{--bg:#fff4f7;--line:#f2d5df;--ink:#3b1a28;--muted:#8a6577;--accent:#b02a5b}
:root[data-estilo="lila"]{--bg:#f8f4fd;--line:#e4d9f1;--ink:#2b1d3d;--muted:#7a6a90;--accent:#6b3fa0}}
:root[data-theme="light"][data-estilo="rosa"]{--bg:#fff4f7;--line:#f2d5df;--ink:#3b1a28;--muted:#8a6577;--accent:#b02a5b}
:root[data-theme="light"][data-estilo="lila"]{--bg:#f8f4fd;--line:#e4d9f1;--ink:#2b1d3d;--muted:#7a6a90;--accent:#6b3fa0}
:root[data-estilo="rosa"] body,:root[data-estilo="lila"] body{background-image:radial-gradient(circle at 100% 0,color-mix(in srgb,var(--accent) 12%,transparent),transparent 45%)}
:root[data-estilo="rosa"] .panel,:root[data-estilo="rosa"] .case,:root[data-estilo="rosa"] .detail,:root[data-estilo="rosa"] .totals,:root[data-estilo="lila"] .panel,:root[data-estilo="lila"] .case,:root[data-estilo="lila"] .detail,:root[data-estilo="lila"] .totals{border-radius:20px;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 10%,transparent)}
:root[data-estilo="rosa"] button,:root[data-estilo="lila"] button{border-radius:99px}
:root[data-estilo="rosa"] input,:root[data-estilo="rosa"] select,:root[data-estilo="rosa"] textarea,:root[data-estilo="lila"] input,:root[data-estilo="lila"] select,:root[data-estilo="lila"] textarea{border-radius:14px}
:root[data-estilo="rosa"] .tabs,:root[data-estilo="lila"] .tabs{border-bottom:0;gap:6px}
:root[data-estilo="rosa"] .tabs button,:root[data-estilo="lila"] .tabs button{border:1px solid var(--line);border-radius:99px;background:var(--surface)}
:root[data-estilo="rosa"] .tabs button.on,:root[data-estilo="lila"] .tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-estilo="rosa"] h1::after,:root[data-estilo="lila"] h1::after{content:" ✦";color:var(--accent);font-size:.6em;vertical-align:super}
:root[data-estilo="rosa"] dialog,:root[data-estilo="lila"] dialog{border-radius:24px}
.estilos{display:grid;gap:10px;margin-top:10px}
.estilos button{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:16px}
.estilos button.on{outline:2px solid var(--accent)}
.estilos i{width:26px;height:26px;border-radius:50%;display:inline-block;flex:none}

/* Ajustes para celular */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{overflow-x:hidden;touch-action:manipulation}
.tabs{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;white-space:nowrap}
@media (max-width:520px){
 input,select,textarea{font-size:16px}
 .wrap{padding:10px}
 header.top{flex-wrap:nowrap;gap:8px;align-items:flex-start}
 .brand{min-width:0;flex:1 1 auto}
 .brand h1{font-size:22px}
 header.top #newCase{flex:none;padding:8px 12px;white-space:nowrap}
 .tabs{gap:0;margin-left:-4px;margin-right:-4px;padding:0}
 #sync{max-width:100%}
 .tabs button{padding:8px 4px;font-size:12px}
 .kpis{grid-template-columns:1fr 1fr}
 .alert button,.alert div{min-width:0;overflow-wrap:anywhere}
 dialog{padding:14px;max-height:92vh;overflow:auto}
 .calhead{gap:6px}.calhead h2{min-width:0;font-size:17px;flex:1 1 100%;order:-1;text-align:left}
 .calhead button{padding:6px 10px;font-size:13px}
 .case .row{flex-wrap:wrap}
 .kv{grid-template-columns:1fr 1fr}
}

a{color:var(--accent)}
.sec{flex-wrap:wrap;gap:2px 10px}.sec h3{margin-right:auto}
@media (max-width:520px){.scroll table{min-width:430px}.scroll td,.scroll th{padding:7px 8px}}

.fbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}.fbar i{display:block;height:100%;background:var(--accent)}
.fbar.over i{background:var(--bad)}
.mov{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.mov .m{color:var(--muted);font-size:13px}
.ing{color:var(--ok)}.gas{color:var(--bad)}
.fhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.fhead h2{font-size:19px;flex:1;text-align:center;min-width:130px}

.fsub{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;padding-bottom:2px}.fsub::-webkit-scrollbar{display:none}
.fsub button{flex:none;white-space:nowrap;padding:6px 12px;font-size:14px;border-radius:99px}
.fsub button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chart{display:flex;align-items:flex-end;gap:4px;height:150px;margin:10px 0 4px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.chart .pair{display:flex;align-items:flex-end;gap:2px;height:100%;width:100%;justify-content:center}
.chart .pair i{display:block;width:42%;max-width:14px;border-radius:3px 3px 0 0;min-height:1px}
.chart .pair .i{background:var(--ok)}.chart .pair .g{background:var(--bad)}
.chart small{font-size:10px;color:var(--muted);margin-top:3px}
.venc{color:var(--bad);font-weight:600}.pronto{color:var(--warn);font-weight:600}

html[data-lock="1"] .wrap,html[data-lock="1"] #auth{visibility:hidden}
#lock{display:none;position:fixed;inset:0;z-index:99999;background:var(--bg);align-items:center;justify-content:center;padding:20px}
html[data-lock="1"] #lock{display:flex}
#lock .box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;width:min(340px,100%);text-align:center}
#lock .logo{height:46px;margin-bottom:6px}
#lock input{text-align:center;font-size:24px;letter-spacing:.4em;margin:12px 0}
.tk{display:flex;align-items:flex-start;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line)}
.tk .ck{flex:none;width:26px;height:26px;border-radius:50%;padding:0;border:2px solid var(--accent);background:var(--surface);color:var(--accent-ink);line-height:1;font-size:15px}
.tk.hecho .ck{background:var(--accent)}.tk.hecho .tt{text-decoration:line-through;color:var(--muted)}
.tk .tt{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;border-radius:0;overflow-wrap:anywhere}
.tk .m{color:var(--muted);font-size:12px}
.dia{margin-bottom:10px}.dia h3{font-size:15px;margin-bottom:4px}.dia.hoy h3{color:var(--accent)}
.dia .it{display:block;width:100%;text-align:left;border:0;border-left:4px solid var(--c,var(--line));background:var(--surface);border-radius:8px;padding:6px 10px;margin-bottom:4px}
.prio-a{color:var(--bad)}.prio-m{color:var(--warn)}
.mas button.go{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-bottom:8px;padding:14px;border-radius:14px}
.mas button.go b{display:block}.mas button.go small{color:var(--muted)}
.calcres{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.calcres .l{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.calcres .t{border-top:1px solid var(--line);margin-top:6px;padding-top:6px;font-weight:700}

/* ===== Refresh visual: sobrio y actual ===== */
:root{--hf:"Source Serif 4",Georgia,serif;--mark:var(--accent);--r:12px;--rb:10px}
body{font:15px/1.5 Inter,"Nunito Sans",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
h1,h2{font-family:var(--hf);font-weight:600;letter-spacing:-.01em}
h3{font-family:inherit;font-weight:600;letter-spacing:-.005em}
:root[data-estilo="clasico"]{--bg:#f6f4f3;--ink:#1e1517;--muted:#6c6164;--line:#e8e2e2}
.case,.detail,.totals,.alert,.kpi,.panel{box-shadow:none;border-radius:var(--r)}
.case{border-left-width:3px;padding:12px 14px}
.case:hover,.mov:hover{border-color:color-mix(in srgb,var(--ink) 22%,var(--line))}
.kpi{padding:14px 16px}
.kpi small{font-size:12.5px}
.kpi b{font-family:inherit;font-size:24px;font-weight:600;letter-spacing:-.02em;display:block;margin-top:2px}
.age b{font-family:inherit;font-size:22px;font-weight:600}
.totals b{font-weight:600;letter-spacing:-.01em}
.totals small,.kv small{font-size:12.5px}
.panel h3,.sec h3{font-size:15px}
.sec{border-bottom:0;padding-bottom:0}
button{border-radius:var(--rb);padding:8px 14px;font-weight:500;transition:background .15s,border-color .15s}
button:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
button.primary{font-weight:600}
button.primary:hover{filter:brightness(1.12)}
button.link{font-weight:500}
button.link:hover{border:0;text-decoration:underline}
input,select,textarea{border-radius:var(--rb);padding:9px 11px}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
dialog{border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.tag{border-radius:6px;padding:1px 8px;font-size:11.5px}
.bar,.fbar{height:5px}
header.top{margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
header.top .brand h1{font-size:24px}
.logo{height:58px}
.brand{gap:14px}
.brand>div{min-width:0}
#sync{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.authbox .logo{height:84px}
#lock .logo{height:64px}
#sync{font-size:12px}
#estiloBtn,#logout{display:none!important}
#newCase::before{content:"+";font-size:17px;line-height:1;margin-right:6px;font-weight:500}
.tabs button svg{width:21px;height:21px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button span{display:block}
@media (max-width:899px){
 .wrap{padding-bottom:96px}
 .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(6,1fr);gap:0;margin:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:0;border-top:1px solid var(--line);overflow:visible}
 :root[data-estilo] .tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;font-size:11px;font-weight:500;line-height:1.1;border:0;border-radius:10px;background:none;color:var(--muted);position:relative}
 :root[data-estilo] .tabs button.on{background:none;color:var(--accent);font-weight:600;border:0}
 :root[data-estilo] .tabs button.on::before{content:"";position:absolute;top:-7px;left:30%;right:30%;height:2px;border-radius:2px;background:var(--mark)}
}
@media (min-width:900px){
 .tabs button{display:flex;align-items:center;gap:11px}
 :root[data-estilo] .tabs button.on{border-left-color:var(--mark);color:var(--accent);background:var(--surface)}
}
@media (max-width:520px){
 header.top{margin-bottom:12px;padding-bottom:10px}
 header.top .brand h1{font-size:22px}
 .logo{height:50px}
 .brand{gap:10px}
 .kpi b{font-size:21px}
 .kpis{gap:8px}
 :root[data-estilo] .tabs button{font-size:10.5px}
 header.top #newCase{padding:7px 11px;font-size:14px}
}
.mas button.go{border-radius:var(--r);padding:12px 14px}
/* Rosa y lila: más refinados */
:root[data-estilo="rosa"] button,:root[data-estilo="lila"] button{border-radius:12px}
:root[data-estilo="rosa"] .panel,:root[data-estilo="rosa"] .case,:root[data-estilo="rosa"] .detail,:root[data-estilo="rosa"] .totals,:root[data-estilo="lila"] .panel,:root[data-estilo="lila"] .case,:root[data-estilo="lila"] .detail,:root[data-estilo="lila"] .totals{border-radius:16px;box-shadow:0 2px 10px color-mix(in srgb,var(--accent) 7%,transparent)}
:root[data-estilo="rosa"] h1::after,:root[data-estilo="lila"] h1::after{content:none}
:root[data-estilo="rosa"] body,:root[data-estilo="lila"] body{background-image:none}
/* Ejecutivo: serio, azul noche y bronce */
:root[data-estilo="ejecutivo"]{--hf:Inter,system-ui,sans-serif;--r:8px;--rb:7px;--mark:#b08d4f;--bg:#f1f3f6;--surface:#fff;--ink:#121b27;--muted:#5b6a7c;--line:#dce1e8;--accent:#17263c;--accent-ink:#fff;--ok:#2a7a55;--warn:#a5701a;--bad:#b0372c;--info:#2d5b8c}
:root[data-estilo="ejecutivo"] h1,:root[data-estilo="ejecutivo"] h2{font-weight:700;letter-spacing:-.025em}
:root[data-estilo="ejecutivo"] .logo{filter:brightness(0)}
:root[data-estilo="ejecutivo"] .tag{border-radius:4px}
:root[data-estilo="ejecutivo"] dialog{border-radius:12px}
:root[data-estilo="ejecutivo"] .estilos button{border-radius:10px}
@media (prefers-color-scheme:dark){:root[data-estilo="ejecutivo"]:not([data-theme="light"]){--bg:#0e141c;--surface:#171f2b;--ink:#e7ecf2;--muted:#9aa8b9;--line:#263243;--accent:#a9bedb;--accent-ink:#0e141c;--mark:#c9a867;--ok:#6cc08b;--warn:#e0a24a;--bad:#ff8f80;--info:#8dbcea}
 :root[data-estilo="ejecutivo"]:not([data-theme="light"]) .logo{filter:brightness(0) invert(.93)}}
:root[data-theme="dark"][data-estilo="ejecutivo"]{--bg:#0e141c;--surface:#171f2b;--ink:#e7ecf2;--muted:#9aa8b9;--line:#263243;--accent:#a9bedb;--accent-ink:#0e141c;--mark:#c9a867}
:root[data-theme="dark"][data-estilo="ejecutivo"] .logo{filter:brightness(0) invert(.93)}
:root[data-estilo="ejecutivo"] button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Pulido */
.fsub{gap:0;border-bottom:1px solid var(--line);margin-bottom:14px}
.fsub button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 12px;font-size:14px;color:var(--muted)}
.fsub button.on{background:none;color:var(--ink);border-bottom-color:var(--mark);font-weight:600}
:root[data-estilo] .fsub button{border-radius:0}
[data-ftx],[data-fbud],[data-fcsv]{white-space:nowrap}
@media (max-width:520px){button{font-size:14px}.fhead button{padding:7px 11px}.fhead h2{font-size:17px}}

/* Guía de inicio */
.guia .gp{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);border-radius:0;background:none;padding:10px 2px}
.guia .gp:hover{background:none}
.guia .gp small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.guia .gk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--accent-ink);margin-top:1px}
.guia .gp.ok .gk{background:var(--ok);border-color:var(--ok)}
.guia .gp.ok b{color:var(--muted);font-weight:500}
</style>

<body>
<div id="lock"><div class="box"><img class="logo" src="logo.png" alt=""><h2>Sinfín</h2><p style="color:var(--muted);margin:4px 0">Escribe tu PIN para entrar</p><input id="lockPin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="PIN"><div class="err" id="lockErr" role="alert"></div><button class="primary" id="lockOk" style="width:100%">Entrar</button><p><button class="link" id="lockForgot">Olvidé mi PIN</button></p></div></div>
<div class="wrap">
  <header class="top">
    <div class="brand"><img class="logo" src="logo.png" alt=""><div><h1>Sinfín</h1><small id="sync" style="color:var(--muted)">Datos guardados en este navegador</small> <button class="link" id="estiloBtn">Estilo</button> <button class="link hide" id="logout">Salir</button></div></div>
    <button class="primary" id="newCase">Nuevo caso</button>
  </header>

  <nav class="tabs"><button data-tab="dash" class="on">Resumen</button><button data-tab="casos">Casos</button><button data-tab="sem">Semana</button><button data-tab="cal">Calendario</button><button data-tab="fin">Finanzas</button><button data-tab="mas">Más</button></nav>

  <section id="dashView" class="hide"></section>
  <section id="despView" class="hide"></section>
  <section id="contView" class="hide"></section>
  <section id="finView" class="hide"></section>
  <section id="semView" class="hide"></section>
  <section id="masView" class="hide"></section>
  <section id="prosView" class="hide"></section>
  <section id="calcView" class="hide"></section>

  <section id="listView">
    <p id="hello" class="hello"></p>
    <div id="alerts"></div>
    <div class="totals" id="totals"></div>
    <div class="tools">
      <input id="q" type="search" placeholder="Buscar por cliente, caso o número" aria-label="Buscar">
      <select id="flt" aria-label="Filtrar por estado">
        <option value="">Todos los estados</option><option>Activo</option><option>En pausa</option><option>Cerrado</option>
      </select>
    </div>
    <div id="cases"></div>
    <p style="margin-top:18px;color:var(--muted);font-size:13px">Tus datos se guardan en este navegador. <button class="link" id="bk">Descargar copia de seguridad</button> <button class="link" id="rs">Restaurar copia</button> <a href="privacidad.html" style="color:var(--accent)">Política de privacidad</a><input type="file" id="rsf" accept=".json,application/json" class="hide"></p>
  </section>

  <section id="detailView" class="hide"></section>
  <section id="calView" class="hide"></section>
</div>

<div id="auth" class="hide"><form class="authbox" id="authForm"><img class="logo" src="logo.png" alt="Logo"><h2>Sinfín</h2><p style="color:var(--muted);margin:0 0 6px">Cada caso, sin perder el hilo. Entra para ver tus casos desde cualquier dispositivo.</p><label for="aEmail">Correo</label><input id="aEmail" type="email" autocomplete="email" required><label for="aPass">Contraseña</label><input id="aPass" type="password" autocomplete="current-password" minlength="6" required><div class="err" id="authMsg" role="alert"></div><div class="row2"><button class="primary" value="in">Entrar</button><button value="up">Crear cuenta</button></div></form></div>
<dialog id="dlg"><form method="dialog" id="frm" novalidate></form></dialog>

<script>
const KEY='casos-honorarios-v1';
let db={cases:[],entries:[],payments:[]};
try{const s=localStorage.getItem(KEY);if(s)db=JSON.parse(s)}catch(e){}
if(!db.cases.length&&!localStorage.getItem(KEY+'-init')&&!(window.APP_CONFIG&&window.APP_CONFIG.url&&!/TU-PROYECTO/.test(window.APP_CONFIG.url))){
  try{localStorage.setItem(KEY+'-init','1')}catch(e){}
  db.cases=[{id:'c1',number:'2026-014',client:'Marta Ríos',title:'Divorcio de mutuo acuerdo',type:'Familia',status:'Activo',feeType:'fijo',amount:1800},
  {id:'c2',number:'2026-021',client:'Taller Norte S.L.',title:'Reclamación de impagos',type:'Mercantil',status:'Activo',feeType:'hora',amount:120},
  {id:'c3',number:'2026-030',client:'Andrés Vela',title:'Indemnización por accidente',type:'Civil',status:'En pausa',feeType:'exito',amount:15,recovered:20000}];
  db.entries=[{id:'e1',caseId:'c2',date:'2026-09-10',desc:'Revisión de facturas y contrato',hours:3.5},{id:'e2',caseId:'c2',date:'2026-09-24',desc:'Burofax y llamada con la contraparte',hours:1.5}];
  db.payments=[{id:'p1',caseId:'c1',date:'2026-09-01',amount:900,note:'Provisión de fondos'},{id:'p2',caseId:'c2',date:'2026-09-30',amount:300,note:''}];
  save();
}
var cloud=null,cloudT=null,lastCloud='',pendCloud=false;
function setSync(t){const el=document.getElementById('sync');if(el)el.textContent=t}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}
 if(cloud){setSync('Guardando…');pendCloud=true;clearTimeout(cloudT);cloudT=setTimeout(async()=>{try{lastCloud=JSON.stringify(db);await cloud.set({json:lastCloud});if(window.watchSync)await watchSync();setSync('Guardado en la nube')}catch(e){setSync('No se pudo guardar en la nube')}pendCloud=false},600)}}
if(!db.docs)db.docs=[];if(!db.posts)db.posts=[];if(!db.updates)db.updates=[];if(!db.events)db.events=[];if(!db.invoices)db.invoices=[];
try{if(!db.updates.length&&!db.events.length&&!localStorage.getItem(KEY+'-d2')&&db.cases.some(c=>c.id==='c2')){localStorage.setItem(KEY+'-d2','1');
 db.updates=[{id:'u1',caseId:'c1',date:'2026-09-05',stage:'Demanda presentada',court:'Juzgado de Familia nº 2',note:'Se presenta el convenio regulador firmado por ambas partes.'},{id:'u2',caseId:'c2',date:'2026-09-12',stage:'Demanda presentada',court:'Juzgado de 1ª Instancia nº 4',note:''},{id:'u3',caseId:'c2',date:'2026-09-29',stage:'Admitida a trámite',court:'Juzgado de 1ª Instancia nº 4',note:'El juzgado admite la demanda y da traslado al demandado por 20 días.'}];
 db.events=[{id:'v1',caseId:'c1',date:'2026-10-16',time:'11:00',title:'Reunión con Marta Ríos',type:'Reunión'},{id:'v2',caseId:'c2',date:'2026-10-19',time:'',title:'Vence plazo de contestación',type:'Plazo'},{id:'v3',caseId:'c2',date:'2026-10-22',time:'10:30',title:'Audiencia previa',type:'Audiencia'}];save()}}catch(e){}
const $=id=>document.getElementById(id);
const uid=p=>p+Math.random().toString(36).slice(2,9);
const eur=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fdate=d=>d?new Date(d+'T00:00').toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'}):'';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

function stats(c){
  const hrs=db.entries.filter(e=>e.caseId===c.id).reduce((s,e)=>s+e.hours,0);
  let billed=0;
  if(c.feeType==='hora')billed=hrs*c.amount;
  else if(c.feeType==='fijo')billed=c.amount;
  else billed=(c.recovered||0)*c.amount/100;
  const paid=db.payments.filter(p=>p.caseId===c.id).reduce((s,p)=>s+p.amount,0);
  return{hrs,billed,paid,due:billed-paid};
}
const feeLabel=c=>c.feeType==='hora'?eur(c.amount)+' / hora':c.feeType==='fijo'?'Tarifa fija '+eur(c.amount):c.amount+'% sobre lo recuperado';
const color=s=>s==='Activo'?'var(--ok)':s==='En pausa'?'var(--warn)':'var(--muted)';

let current=null;
function render(){
  try{if(pagosSync())save()}catch(e){}
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===(['desp','cont','pros','calc'].includes(view)?'mas':view)&&!b.classList.contains('link')));
  renderAlerts();
  ['dashView','listView','detailView','calView','despView','contView','finView','semView','masView','prosView','calcView'].forEach(i=>$(i).classList.add('hide'));
  if(view==='sem')return renderSem();
  if(view==='mas')return renderMas();
  if(view==='pros')return renderPros();
  if(view==='calc')return renderCalc();
  if(view==='fin')return renderFin();
  if(view==='cont')return renderCont();
  if(view==='dash')return renderDash();
  if(view==='desp')return renderDesp();
  if(view==='cal')return renderCal();
  $('calView').classList.add('hide');
  if(current&&db.cases.find(c=>c.id===current))return renderDetail();
  current=null;$('detailView').classList.add('hide');$('listView').classList.remove('hide');
  const all=db.cases.map(stats);
  const B=all.reduce((s,x)=>s+x.billed,0),P=all.reduce((s,x)=>s+x.paid,0);
  $('totals').innerHTML=`<div><small>Facturable</small><b class="num">${eur(B)}</b></div><div class="paid"><small>Cobrado</small><b class="num">${eur(P)}</b></div><div class="pending"><small>Pendiente</small><b class="num">${eur(B-P)}</b></div>`;
  const q=$('q').value.toLowerCase(),f=$('flt').value;
  const list=db.cases.filter(c=>(!f||c.status===f)&&(c.client+c.title+c.number).toLowerCase().includes(q));
  $('cases').innerHTML=list.length?list.map(c=>{const s=stats(c),pct=s.billed?Math.min(100,s.paid/s.billed*100):0;
    return `<button class="case" style="--c:${color(c.status)}" data-id="${c.id}"><div class="row"><span class="t">${esc(c.client)}</span><span class="num">${eur(s.due)} pendiente</span></div>
    <div class="row m"><span>${esc(c.title)} · ${esc(c.number)}</span><span class="tag">${c.status}</span></div>
    ${stageOf(c.id)?`<div class="m">Fase: ${esc(stageOf(c.id))}</div>`:''}
    <div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div></button>`}).join('')
    :`<div class="empty">${db.cases.length?'Ningún caso coincide con la búsqueda.':'Aún no hay casos. Pulsa “Nuevo caso” para registrar el primero.'}</div>`;
}
function renderDetail(){
  const c=db.cases.find(x=>x.id===current),s=stats(c);
  $('listView').classList.add('hide');$('detailView').classList.remove('hide');
  const es=db.entries.filter(e=>e.caseId===c.id).sort((a,b)=>b.date.localeCompare(a.date));
  const ps=db.payments.filter(p=>p.caseId===c.id).sort((a,b)=>b.date.localeCompare(a.date));
  const hourly=c.feeType==='hora';
  $('detailView').innerHTML=`<button class="link" id="back">‹ Todos los casos</button>
  <div class="detail"><div class="head"><div><h2>${esc(c.client)}</h2><div class="m" style="color:var(--muted)">${[c.title,c.number,c.type].filter(Boolean).map(esc).join(' · ')}</div></div>
  <div><span class="tag">${c.status}</span> <button class="link" id="editCase">Editar</button></div></div>
  <div class="kv"><div><small>Honorarios</small><b>${feeLabel(c)}</b></div><div><small>Facturable</small><b class="num">${eur(s.billed)}</b></div><div><small>Cobrado</small><b class="num" style="color:var(--ok)">${eur(s.paid)}</b></div><div><small>Pendiente</small><b class="num" style="color:var(--warn)">${eur(s.due)}</b></div></div>
  ${c.feeType==='exito'?`<div style="color:var(--muted)">Importe recuperado: ${eur(c.recovered)}</div>`:''}
  ${contactosHtml(c)}${procHtml(c)}${hourly?`<div class="sec"><h3>Horas (${s.hrs.toLocaleString('es-ES')} h)</h3><button class="link" id="addE">Añadir horas</button></div>
  ${es.length?`<div class="scroll"><table><tr><th>Fecha</th><th>Trabajo</th><th class="r">Horas</th><th class="r">Importe</th><th></th></tr>${es.map(e=>`<tr><td>${fdate(e.date)}</td><td>${esc(e.desc)}</td><td class="r num">${e.hours}</td><td class="r num">${eur(e.hours*c.amount)}</td><td><button class="link danger" data-de="${e.id}" aria-label="Eliminar registro">Eliminar</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Sin horas registradas. Añade la primera para calcular los honorarios.</div>'}`:''}
  <div class="sec"><h3>Pagos recibidos</h3><span><button class="link" id="addCobro">Recordar cobro</button> · <button class="link" id="addP">Registrar pago</button></span></div>
  ${ps.length?`<div class="scroll"><table><tr><th>Fecha</th><th>Concepto</th><th class="r">Importe</th><th></th></tr>${ps.map(p=>`<tr><td>${fdate(p.date)}</td><td>${esc(p.note)||'—'}</td><td class="r num">${eur(p.amount)}</td><td><button class="link danger" data-dp="${p.id}" aria-label="Eliminar pago">Eliminar</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Aún no hay pagos de este cliente.</div>'}
  ${docsHtml(c)}
  ${invHtml(c)}
  </div>`;
}

function form(title,fields,onOk,extra){
  const f=$('frm');f.oninput=null;f.onchange=null;
  f.innerHTML=`<h2>${title}</h2>${fields}<div class="err" id="err" role="alert"></div><div class="actions">${extra||''}<button type="button" id="cancel">Cancelar</button><button class="primary" id="ok" type="submit">Guardar</button></div>`;
  $('cancel').onclick=()=>$('dlg').close();
  f.onsubmit=ev=>{ev.preventDefault();const r=onOk(f);if(r){$('err').textContent=r}else{$('dlg').close();save();render()}};
  $('dlg').showModal();
}
const val=n=>$('frm').elements[n].value.trim();
const F=(l,n,v='',t='text',x='')=>`<label for="f_${n}">${l}</label><input id="f_${n}" name="${n}" type="${t}" value="${esc(v)}" ${x}>`;

function caseForm(c,pre){
  const e=!!c;c=c||{status:'Activo',feeType:'hora',type:'Civil',...(pre||{})};
  form(e?'Editar caso':'Nuevo caso',
   F('Radicado de 23 dígitos (rellena los datos solo y activa los avisos)','radicado',c.radicado||'','text','inputmode="numeric" maxlength="40" autocomplete="off"')+'<div id="rinfo" class="rinfo" aria-live="polite"></div>'+F('Demandante','demandante',c.demandante||'')+F('Demandado','demandado',c.demandado||'')+F('Cliente','client',c.client)+F('Asunto','title',c.title)+F('Número de expediente','number',c.number)+
   `<label for="f_type">Área</label><select id="f_type" name="type">${['Civil','Penal','Mercantil','Laboral','Familia','Administrativo','Otro'].map(o=>`<option ${o===c.type?'selected':''}>${o}</option>`).join('')}</select>
   <label for="f_status">Estado</label><select id="f_status" name="status">${['Activo','En pausa','Cerrado'].map(o=>`<option ${o===c.status?'selected':''}>${o}</option>`).join('')}</select>
   <label for="f_feeType">Tipo de honorarios</label><select id="f_feeType" name="feeType"><option value="hora" ${c.feeType==='hora'?'selected':''}>Por hora</option><option value="fijo" ${c.feeType==='fijo'?'selected':''}>Tarifa fija</option><option value="exito" ${c.feeType==='exito'?'selected':''}>A éxito (porcentaje)</option></select>`+
   F('Tarifa ($ por hora, $ total o %)','amount',c.amount??'','number','step="0.01" min="0"')+
   `<div id="recw">${F('Importe recuperado ($)','recovered',c.recovered??'','number','step="0.01" min="0"')}</div>`+
   `<h3 style="margin-top:16px">Contactos</h3>`+F('Teléfono / WhatsApp del cliente','cTel',c.cTel||'','tel','inputmode="tel"')+F('Correo del cliente','cMail',c.cMail||'','email')+F('Contraparte','contra',c.contra||'')+F('Abogado de la contraparte','contraAb',c.contraAb||'')+F('Teléfono o correo de la contraparte','contraTel',c.contraTel||''),
  f=>{const d={client:val('client'),title:val('title'),number:val('number'),radicado:val('radicado').replace(/\D/g,''),type:val('type'),status:val('status'),feeType:val('feeType'),amount:parseFloat(val('amount')),cTel:val('cTel'),cMail:val('cMail'),contra:val('contra'),contraAb:val('contraAb'),contraTel:val('contraTel'),demandante:val('demandante'),demandado:val('demandado')};
    if(d.radicado.length===23){const rx=window.__rx||{};Object.assign(d,rx,{demandante:d.demandante||rx.demandante||'',demandado:d.demandado||rx.demandado||''});if(!d.client)d.client='Por definir cliente';if(!d.title)d.title=d.clase||('Proceso '+d.radicado.slice(12,16)+'-'+d.radicado.slice(16,21))}
    if(!d.client||!d.title)return 'Indica el cliente y el asunto, o escribe el radicado de 23 dígitos.';
    if(d.radicado&&d.radicado.length!==23)return 'El radicado debe tener 23 dígitos.';

/* ===== Calculadora de términos judiciales ===== */
const TERM={
 iso:d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),
 parse:s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)},
 add:(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x},
 easter:y=>{const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=(h+l-7*m+114)%31+1;return new Date(y,mo-1,da)},
 toMon:d=>{const w=d.getDay();return w===1?d:TERM.add(d,(8-w)%7)},
 cache:{},
 holidays(y){
  if(this.cache[y])return this.cache[y];
  const H={},put=(d,n)=>{H[this.iso(d)]=n},E=this.easter(y);
  [[0,1,'Año Nuevo'],[4,1,'Día del Trabajo'],[6,20,'Independencia'],[7,7,'Batalla de Boyacá'],[11,8,'Inmaculada Concepción'],[11,25,'Navidad']].forEach(([m,d,n])=>put(new Date(y,m,d),n));
  [[0,6,'Reyes Magos'],[2,19,'San José'],[5,29,'San Pedro y San Pablo'],[7,15,'Asunción'],[9,12,'Día de la Raza'],[10,1,'Todos los Santos'],[10,11,'Independencia de Cartagena']].forEach(([m,d,n])=>put(this.toMon(new Date(y,m,d)),n));
  put(this.add(E,-3),'Jueves Santo');put(this.add(E,-2),'Viernes Santo');
  put(this.toMon(this.add(E,39)),'Ascensión');put(this.toMon(this.add(E,60)),'Corpus Christi');put(this.toMon(this.add(E,68)),'Sagrado Corazón');
  return this.cache[y]=H;
 },
 vacancia(d){
  const m=d.getMonth(),n=d.getDate();
  if((m===11&&n>=20)||(m===0&&n<=10))return 'Vacancia judicial (20 dic – 10 ene)';
  const E=this.easter(d.getFullYear()),ini=this.add(E,-6),fin=E;
  if(d>=ini&&d<=fin)return 'Semana Santa (vacancia judicial)';
  return '';
 },
 // devuelve motivo por el que NO corre término, o '' si es día hábil
 noHabil(d,vac){
  const w=d.getDay();if(w===0)return 'Domingo';if(w===6)return 'Sábado';
  const h=this.holidays(d.getFullYear())[this.iso(d)];if(h)return 'Festivo: '+h;
  if(vac){const v=this.vacancia(d);if(v)return v}
  return '';
 },
 calcular(inicio,n,modo,vac){
  let d=this.parse(inicio),cont=0,saltados=[];
  if(modo==='habiles'){
   while(cont<n){d=this.add(d,1);const r=this.noHabil(d,vac);if(r){saltados.push([this.iso(d),r])}else cont++}
  }else{
   d=this.add(d,n);
   while(this.noHabil(d,vac)){saltados.push([this.iso(d),this.noHabil(d,vac)]);d=this.add(d,1)}
  }
  return{fin:this.iso(d),saltados};
 }
};

async function docSubir(file,caseId,cat){
 if(file.size>DOC_MAX)return alert('El archivo pesa más de 20 MB.');

  say('Verificando sesión…');
  const{data:ss}=await conTiempo(sb.auth.getSession(),15000,'La sesión no responde. Cierra la app, ábrela e inicia sesión de nuevo.');
  const uidNow=ss&&ss.session&&ss.session.user&&ss.session.user.id;
  if(!uidNow)throw new Error('Tu sesión expiró. Cierra sesión y vuelve a entrar.');
  const path=`${uidNow}/${caseId}/${id}-${safe}`;
  say('Subiendo '+kb(file.size)+'…');
  const{error}=await conTiempo(sb.storage.from('documentos').upload(path,file,{contentType:file.type||'application/octet-stream'}),90000,'La subida tardó demasiado ('+kb(file.size)+'). Revisa tu internet o prueba con un archivo más pequeño.');
  if(error)throw new Error(error.message||String(error));

  db.docs.push({id,caseId,name:file.name,path,size:file.size,cat,fecha:today()});save();render();
 }catch(err){alert('No se pudo subir el documento.\n\n'+(err&&err.message||err));say('Subir documento')}
}

 const L=[['Cliente','Asunto','Radicado','Horas del mes','Honorarios por horas (COP)','Cobrado en el mes (COP)','Actuaciones'].map(q).join(';')];
 R.filas.forEach(f=>L.push([f.cliente,f.asunto,f.radicado,f.horas,Math.round(f.facturado),Math.round(f.cobrado),f.actuaciones].map(q).join(';')));
 saveFile({filename:'reporte-'+mes+'.csv',data:new Blob(['﻿'+L.join('\r\n')],{type:'text/csv;charset=utf-8'})});
}
function reportePdf(mes){
 if(!window.jspdf)return alert('No se pudo cargar el generador de PDF. Recarga la página.');
 const R=reporteDatos(mes),d=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),f=db.firm||{};let y=20;
 const nombreMes=new Date(mes+'-01T00:00').toLocaleDateString('es-CO',{month:'long',year:'numeric'});
 const salto=n=>{if(y+n>282){d.addPage();y=20}};
 d.setFont('helvetica','bold');d.setFontSize(18);d.text('Reporte mensual',20,y);
 d.setFontSize(11);d.setFont('helvetica','normal');d.text(nombreMes.charAt(0).toUpperCase()+nombreMes.slice(1),190,y,{align:'right'});
 y+=7;if(f.name){d.setTextColor(110);d.text(f.name,20,y);d.setTextColor(0);y+=6}
 const tH=R.filas.reduce((s,x)=>s+x.horas,0),tF=R.filas.reduce((s,x)=>s+x.facturado,0),tC=R.filas.reduce((s,x)=>s+x.cobrado,0),tA=R.filas.reduce((s,x)=>s+x.actuaciones,0);
 y+=4;d.setFont('helvetica','bold');d.text('Resumen',20,y);y+=6;d.setFont('helvetica','normal');
 [['Horas trabajadas',String(tH)],['Honorarios por horas',eur(tF)],['Cobrado en el mes',eur(tC)],['Actuaciones registradas',String(tA)]].forEach(([k,v])=>{d.text(k,24,y);d.text(v,190,y,{align:'right'});y+=6});
 y+=4;d.setFont('helvetica','bold');d.text('Por cliente',20,y);y+=6;
 if(!R.filas.length){d.setFont('helvetica','normal');d.text('No hay movimientos en este mes.',24,y);y+=6}
 R.filas.forEach(x=>{salto(14);d.setFont('helvetica','bold');d.setFontSize(10);d.text(d.splitTextToSize(x.cliente+(x.radicado?'  ·  '+x.radicado:''),170),24,y);y+=5;
  d.setFont('helvetica','normal');d.text(x.horas+' h  ·  honorarios '+eur(x.facturado)+'  ·  cobrado '+eur(x.cobrado)+'  ·  '+x.actuaciones+' actuaciones',24,y);y+=7});
 if(R.pagos.length){y+=2;salto(14);d.setFontSize(11);d.setFont('helvetica','bold');d.text('Pagos recibidos',20,y);y+=6;d.setFontSize(10);d.setFont('helvetica','normal');
  R.pagos.sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(p=>{salto(6);d.text(fdate(p.fecha)+'  ·  '+p.cliente+(p.nota?'  ·  '+p.nota:''),24,y);d.text(eur(p.monto),190,y,{align:'right'});y+=6})}
 if(R.horas.length){y+=2;salto(14);d.setFontSize(11);d.setFont('helvetica','bold');d.text('Detalle de horas',20,y);y+=6;d.setFontSize(10);d.setFont('helvetica','normal');
  R.horas.sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(h=>{salto(6);d.text(d.splitTextToSize(fdate(h.fecha)+'  ·  '+h.cliente+'  ·  '+h.desc,150),24,y);d.text(h.horas+' h',190,y,{align:'right'});y+=6})}
 saveFile({filename:'reporte-'+mes+'.pdf',data:d.output('blob')});
}

/* ===== Sincronización con Google Calendar (por Edge Function) ===== */
let gBusy=false,gTimer=null;window.__gerr='';
const gHash=(e,c)=>JSON.stringify([e.title,e.date,e.time||'',e.type,c?c.client+'|'+c.title+'|'+(c.radicado||''):'']);
function gQueue(){if(!db.gcalOn||!sb||!userId)return;clearTimeout(gTimer);gTimer=setTimeout(gRun,1500)}
async function gCall(body){
 const x=await sb.functions.invoke('calendario-google',{body:{...body,calId:db.gcalId||''}});
 if(x.error){let m='No se pudo conectar con Google Calendar.';try{const j=await x.error.context.json();if(j&&j.error)m=j.error}catch(e){}throw new Error(m)}
 if(x.data&&x.data.error)throw new Error(x.data.error);return x.data;
}
async function gRun(){
 if(gBusy||!db.gcalOn||!sb||!userId)return;gBusy=true;window.__gerr='';
 try{
  db.gmap=db.gmap||{};const t=today();let cambio=false;
  for(const id of Object.keys(db.gmap)){
   if(!db.events.some(e=>e.id===id)){await gCall({accion:'borrar',g:db.gmap[id].g});delete db.gmap[id];cambio=true}
  }
  for(const e of db.events){
   if(e.date<t&&!db.gmap[e.id])continue;
   const c=db.cases.find(x=>x.id===e.caseId),h=gHash(e,c),m=db.gmap[e.id];
   if(m&&m.h===h)continue;
   const desc=(c?'Caso: '+c.client+' — '+c.title+(c.radicado?'\nRadicado: '+c.radicado:''):'')+'\nCreado desde Sinfín';
   const r=await gCall({accion:'guardar',evento:{title:(e.type==='Audiencia'||e.type==='Plazo'||e.type==='Cobro'?e.type+': ':'')+e.title,date:e.date,time:e.time||'',type:e.type,desc,g:m&&m.g}});
   db.gmap[e.id]={g:r.g,h};cambio=true;
  }
  if(cambio)save();
 }catch(err){window.__gerr=err.message||String(err)}
 gBusy=false;
}
const _saveOrig=save;save=function(){_saveOrig.apply(this,arguments);gQueue()};
function gcalForm(){
 const on=!!db.gcalOn,n=Object.keys(db.gmap||{}).length;
 form('Google Calendar',
  `<p style="margin:0 0 8px">${on?`<b>Conectado.</b> Los plazos, audiencias y demás eventos nuevos se envían solos a tu calendario de Google (${n} sincronizados).`:'Conecta Sinfín con tu calendario de Google para que cada evento te llegue como notificación a tu celular.'}</p>`+
  `<p style="font-size:.85rem;color:var(--muted);margin:0 0 8px">Los eventos con hora avisan 1 día y 1 hora antes. Los de día completo avisan 3 días antes y el día anterior, a las 9:00 a. m.</p>`+
  `<div id="gx"></div><div id="gmsg" class="err" role="alert">${esc(window.__gerr||'')}</div>`,
  ()=>{},
  `${on?'<button type="button" class="danger" id="gOff" style="margin-right:auto">Desconectar</button>':''}<button type="button" class="primary" id="gOn">${on?'Sincronizar ahora':'Conectar'}</button>`);
 $('ok').classList.add('hide');$('cancel').textContent='Cerrar';
 const msg=t=>{$('gmsg').style.color='var(--ink)';$('gmsg').textContent=t};
 let propia=true;
 if(sb&&userId)gCall({accion:'info'}).then(r=>{if(r.propia&&!db.gcalId)return;propia=false;
  $('gx').innerHTML=`<div style="background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:13.5px"><b>Antes de conectar:</b><ol style="margin:6px 0 0;padding-left:20px"><li>En Google Calendar (en el computador) crea un calendario nuevo, por ejemplo "Sinfín".</li><li>En sus ajustes, entra a <b>Compartir con personas concretas</b> y agrega este correo con permiso <b>Realizar cambios en eventos</b>:<br><code id="gsa" style="word-break:break-all;user-select:all">${esc(r.correo||'')}</code></li><li>En <b>Integrar el calendario</b>, copia el <b>ID del calendario</b> y pégalo aquí:</li></ol>${F('ID del calendario','gId',db.gcalId||'')}</div>`}).catch(()=>{});
 $('gOn').onclick=async()=>{
  if(!sb||!userId)return msg('Inicia sesión primero.');
  if($('gId')){const v=$('gId').value.trim();if(!v)return msg('Pega el ID de tu calendario.');db.gcalId=v}
  $('gOn').disabled=true;msg('Conectando…');
  try{const r=await gCall({accion:'probar'});db.gcalOn=true;db.gmap=db.gmap||{};save();msg('Conectado con "'+r.nombre+'". Enviando tus eventos…');
   gBusy=false;await gRun();msg(window.__gerr?('Se conectó, pero falló un evento: '+window.__gerr):'Listo. Revisa tu Google Calendar en unos segundos.')}
  catch(err){$('gmsg').style.color='var(--bad)';$('gmsg').textContent=err.message}
  $('gOn').disabled=false;
 };
 if(on)$('gOff').onclick=()=>{if(confirm('¿Dejar de sincronizar? Los eventos que ya están en Google se quedan.')){db.gcalOn=false;save();$('dlg').close()}};
}

/* ===== Finanzas personales: ingresos y gastos ===== */
const CAT_GASTO={
 'Personales':['Vivienda (arriendo o cuota)','Servicios públicos','Internet y celular','Alimentación y mercado','Restaurantes y domicilios','Transporte personal','Salud (EPS, medicinas, citas)','Educación','Hijos y familia','Ropa y calzado','Belleza y bienestar','Ocio y salidas','Viajes','Suscripciones (streaming, apps)','Mascotas','Regalos y donaciones','Seguros','Deudas y tarjetas','Ahorro e inversión','Imprevistos','Otros gastos personales'],
 'Del despacho':['Seguridad social y pensión','Impuestos (renta, ICA)','Software y herramientas','Arriendo u oficina','Papelería y copias','Aranceles y gastos judiciales','Publicidad y redes','Capacitación y libros','Transporte laboral','Honorarios a terceros','Cuotas y tarjeta profesional','Otros gastos del despacho']};
const CAT_INGRESO=['Honorarios','Salario','Arriendos recibidos','Rendimientos e inversiones','Ventas','Apoyos y regalos','Reembolsos','Otros ingresos'];
const MEDIOS=['Efectivo','Tarjeta débito','Tarjeta crédito','Transferencia','Nequi','Daviplata','Otro'];
const ambitoDe=c=>CAT_GASTO['Del despacho'].includes(c)?'Del despacho':'Personal';
const finDB=()=>{if(!db.fin)db.fin={};if(!db.fin.tx)db.fin.tx=[];if(!db.fin.budgets)db.fin.budgets={};return db.fin};
let finMes=today().slice(0,7);
const cap1=t=>t.charAt(0).toUpperCase()+t.slice(1);
const mesTxt=m=>cap1(new Date(m+'-01T00:00').toLocaleDateString('es-CO',{month:'long',year:'numeric'}));
const mesMov=(m,d)=>{const x=new Date(m+'-01T00:00');x.setMonth(x.getMonth()+d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')};
function finMovs(m){
 const F=finDB(),out=[],dias=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
 F.tx.forEach(t=>{
  if(t.date.startsWith(m))out.push({...t,master:t.id});
  else if(t.rec&&t.date.slice(0,7)<m&&(!t.hasta||t.hasta.slice(0,7)>=m)){const dd=Math.min(+t.date.slice(8,10),dias);out.push({...t,date:m+'-'+String(dd).padStart(2,'0'),virtual:true,master:t.id})}
 });
 db.payments.filter(p=>String(p.date).startsWith(m)).forEach(p=>{const c=db.cases.find(x=>x.id===p.caseId);
  out.push({id:'pay-'+p.id,tipo:'Ingreso',cat:'Honorarios',amount:p.amount,date:p.date,desc:(c?c.client:'Pago de caso')+(p.note?' · '+p.note:''),auto:true})});
 return out.sort((a,b)=>b.date.localeCompare(a.date));
}
function finTot(L){
 const r={ing:0,gas:0,porCat:{},personal:0,despacho:0};
 L.forEach(x=>{if(x.tipo==='Ingreso')r.ing+=x.amount;else{r.gas+=x.amount;r.porCat[x.cat]=(r.porCat[x.cat]||0)+x.amount;if(ambitoDe(x.cat)==='Personal')r.personal+=x.amount;else r.despacho+=x.amount}});
 return r;
}
function finMesHtml(){
 const F=finDB(),L=finMovs(finMes),T=finTot(L),ant=finTot(finMovs(mesMov(finMes,-1))),bal=T.ing-T.gas;
 const cats=Object.entries(T.porCat).sort((a,b)=>b[1]-a[1]);

function pagoOcc(p,a,b){
 const out=[],start=p.fecha,push=d=>{if(d>=a&&d<=b&&d>=start)out.push(d)};
 if(p.rec==='unico'){push(p.fecha);return out}
 const day=+p.fecha.slice(8,10),mo0=+p.fecha.slice(5,7);
 let y=+a.slice(0,4),m=+a.slice(5,7);const yb=+b.slice(0,4),mb=+b.slice(5,7);
 while(y<yb||(y===yb&&m<=mb)){
  const dias=new Date(y,m,0).getDate(),d=y+'-'+pad2(m)+'-'+pad2(Math.min(day,dias));
  if(p.rec==='mensual'||(p.rec==='anual'&&m===mo0))push(d);
  m++;if(m>12){m=1;y++}
 }
 return out;
}
function pagosSync(){
 const F=db.fin;if(!F||!F.pagos)return false;
 const t=today(),lim=TERM.iso(TERM.add(TERM.parse(t),45));let ch=false;
 const quiere=new Set();
 F.pagos.forEach(p=>{if(!p.cal)return;pagoOcc(p,t,lim).forEach(d=>{if(p.paid&&p.paid[d])return;quiere.add('pg-'+p.id+'-'+d);
   if(!db.events.some(e=>e.id==='pg-'+p.id+'-'+d)){db.events.push({id:'pg-'+p.id+'-'+d,caseId:'',pagoId:p.id,date:d,time:'',title:'Pago: '+p.name+(p.amount?' ('+eur(p.amount)+')':''),type:'Pago'});ch=true}})});
 const antes=db.events.length;
 db.events=db.events.filter(e=>!e.pagoId||e.date<t||quiere.has(e.id));
 if(db.events.length!==antes)ch=true;
 return ch;
}

/* ---------- Deudas ---------- */
const deudaSaldo=d=>Math.max(0,d.total-(d.abonos||[]).reduce((s,a)=>s+a.amount,0));
function deudaMeses(d){
 const sal=deudaSaldo(d);if(sal<=0)return 0;if(!(d.cuota>0))return null;
 if(d.tasa>0){const r=Math.pow(1+d.tasa/100,1/12)-1;if(d.cuota<=r*sal)return Infinity;return Math.ceil(-Math.log(1-r*sal/d.cuota)/Math.log(1+r))}
 return Math.ceil(sal/d.cuota);
}
function finDeudasHtml(){
 const L=finDB().deudas,act=L.filter(d=>deudaSaldo(d)>0),tot=act.reduce((s,d)=>s+deudaSaldo(d),0),cuotas=act.reduce((s,d)=>s+(d.cuota||0),0);
 const orden=[...act].sort((a,b)=>(b.tasa||0)-(a.tasa||0)||deudaSaldo(a)-deudaSaldo(b));
 return `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><button class="primary" data-de-new>+ Nueva deuda</button></div>

/* ---------- Calculadoras jurídicas ---------- */
function d360(a,b){const x=TERM.parse(a),y=TERM.parse(b);let d1=x.getDate(),d2=y.getDate();const fm=d=>d.getMonth()===1&&d.getDate()===new Date(d.getFullYear(),2,0).getDate();if(fm(x))d1=30;if(fm(y))d2=30;d1=Math.min(d1,30);d2=Math.min(d2,30);return (y.getFullYear()-x.getFullYear())*360+(y.getMonth()-x.getMonth())*30+(d2-d1)}
const mx=(a,b)=>a>b?a:b;
function liquidar(v){
 const o={};if(!v.ini||!v.fin||v.fin<v.ini||!(v.sal>0))return null;
 o.dias=d360(v.ini,v.fin)+1;const base=v.sal+(v.aux>0?v.aux:0);
 const y=v.fin.slice(0,4),cd=v.cesDesde&&v.cesDesde>=v.ini?v.cesDesde:mx(v.ini,y+'-01-01');o.cesDias=d360(cd,v.fin)+1;
 o.ces=base*o.cesDias/360;o.int=o.ces*o.cesDias*0.12/360;
 const sem=+v.fin.slice(5,7)<=6?y+'-01-01':y+'-07-01',pd=mx(v.ini,sem);o.priDias=d360(pd,v.fin)+1;o.pri=base*o.priDias/360;
 o.vacDias=Math.max(0,o.dias*15/360-(v.vacTom||0));o.vac=v.sal/30*o.vacDias;
 o.ind=0;o.indTxt='';
 if(v.tipo==='Despido sin justa causa'){const a=o.dias/360;
  if(v.contrato==='Término indefinido'){const dd=v.alto?(20+Math.max(0,a-1)*15):(30+Math.max(0,a-1)*20);o.ind=v.sal/30*dd;o.indTxt=`${dd.toFixed(1)} días de salario (art. 64 CST, contrato indefinido${v.alto?', más de 10 salarios mínimos':''})`}
  else if(v.vence&&v.vence>v.fin){const r=Math.max(dBtn(v.fin,v.vence),15);o.ind=v.sal/30*r;o.indTxt=`salarios del tiempo que faltaba (${r} días, art. 64 CST, contrato a término fijo)`}
 }
 o.total=o.ces+o.int+o.pri+o.vac+o.ind;return o;
}

 try{localStorage.removeItem('sinfin-pin')}catch(e){}

 $('despView').innerHTML='<button class="link" data-tab="mas">‹ Más</button><h2 style="margin-bottom:10px">Despachos</h2>'+(ks.length?ks.map(k=>`<div class="panel"><h3>${esc(k)}</h3><p>${g[k].length} ${g[k].length===1?'caso':'casos'}</p>${g[k].map(c=>`<button class="case" data-id="${c.id}" style="--c:${color(c.status)}"><div class="row"><span class="t">${esc(c.client)}</span><span class="num">${esc(c.radicado||c.number||'')}</span></div><div class="row m"><span>${esc(c.title)}</span><span class="tag">${c.status}</span></div></button>`).join('')}</div>`).join(''):'<div class="empty">Aún no hay casos.</div>');
}
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').then(g=>g.update()).catch(()=>{});let rec=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(rec)return;rec=true;if(!document.querySelector('dialog[open]'))location.reload()})}
render();
</script>
</body>
</html>
